# deploy-api.yml — single production deployment authority for the API
name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @repo/api build

      - id: auth
        name: Auth GCP (OIDC — zero static keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/elite-monorepo/api:${{ github.sha }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -f apps/api/Dockerfile \
            -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to the Terraform-owned Cloud Run service
        run: |
          gcloud run deploy elite-api \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 30 \
            --concurrency 80 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production" \
            --quiet

      - name: Independent runtime observation
        run: |
          URL="$(gcloud run services describe elite-api --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')"
          test -n "$URL"
          HEALTH="$(curl --fail --silent --show-error --max-time 10 "$URL/health")"
          echo "HEALTH=$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          READY="$(curl --silent --show-error --max-time 10 -w '\n%{http_code}' "$URL/ready")"
          echo "READY=$READY"
