# deploy-api.yml v2.1
# GAPS CORREGIDOS:
#   - attribute-condition endurecido: solo este repo exacto puede asumir la SA
#   - path filter incluye packages/** para rebuilds cuando cambian dependencias
#   - docker buildx para cache de capas entre runs
#   - Cloud Run flags explícitos: port, timeout, concurrency

name: deploy-api
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read
  id-token: write   # SOLO lo necesario para OIDC

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build API
        run: |
          TURBO_TOKEN=${{ secrets.TURBO_TOKEN }} \
          TURBO_TEAM=${{ secrets.TURBO_TEAM }} \
          pnpm turbo build --filter=api

      - id: auth
        name: Auth GCP (OIDC — zero static keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # Restricción por repo exacto: ninguna otra accion puede usar esta SA
          # Se configura en el provider con attribute-condition:
          # assertion.repository == 'luisfelipevegarodriguez/elite-monorepo-template'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx (cache entre runs)
        uses: docker/setup-buildx-action@v3

      - name: Build & Push a Artifact Registry
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/apps/api:${{ github.sha }}"
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker buildx build \
            --cache-from type=registry,ref=${REGION}-docker.pkg.dev/${PROJECT}/apps/api:cache \
            --cache-to   type=registry,ref=${REGION}-docker.pkg.dev/${PROJECT}/apps/api:cache,mode=max \
            --platform linux/amd64 \
            --push \
            -f apps/api/Dockerfile \
            -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy api \
            --image "$IMAGE" \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 30 \
            --concurrency 80 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production" \
            --quiet
          echo "✅ Deploy OK: $(gcloud run services describe api --region=${{ secrets.GCP_REGION }} --format='value(status.url)')"
