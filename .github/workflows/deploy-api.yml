# deploy-api.yml — single production deployment authority for the API
name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'apps/api/Dockerfile'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @repo/api build

      - name: Validate immutable runtime secret versions
        env:
          DB_VERSION: ${{ secrets.GCP_SECRET_VERSION_DATABASE_URL }}
          AUTH_VERSION: ${{ secrets.GCP_SECRET_VERSION_AUTHORITY_TOKEN }}
          RC_VERSION: ${{ secrets.GCP_SECRET_VERSION_REVENUECAT }}
          SIGN_VERSION: ${{ secrets.GCP_SECRET_VERSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for value in "$DB_VERSION" "$AUTH_VERSION" "$RC_VERSION" "$SIGN_VERSION"; do
            test -n "$value"
            case "$value" in *latest*|*[!0-9]*) exit 1;; esac
          done

      - id: auth
        name: Auth GCP (OIDC — zero static keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/elite-monorepo/api:${{ github.sha }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -f apps/api/Dockerfile \
            -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy with immutable Secret Manager versions
        env:
          REGION: ${{ secrets.GCP_REGION }}
          DB_VERSION: ${{ secrets.GCP_SECRET_VERSION_DATABASE_URL }}
          AUTH_VERSION: ${{ secrets.GCP_SECRET_VERSION_AUTHORITY_TOKEN }}
          RC_VERSION: ${{ secrets.GCP_SECRET_VERSION_REVENUECAT }}
          SIGN_VERSION: ${{ secrets.GCP_SECRET_VERSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          gcloud run deploy elite-api \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 30 \
            --concurrency 80 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production" \
            --set-secrets "DATABASE_URL=elite-api-database-url:${DB_VERSION},AUTHORITY_TOKEN=elite-api-authority-token:${AUTH_VERSION},REVENUECAT_SECRET_KEY=elite-api-revenuecat-secret:${RC_VERSION},CANONICAL_SIGNING_KEY=elite-api-canonical-signing-key:${SIGN_VERSION}" \
            --quiet

      - name: Independent runtime observation
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe elite-api --region="$REGION" --format='value(status.url)')"
          test -n "$URL"
          HEALTH="$(curl --fail --silent --show-error --max-time 10 "$URL/health")"
          echo "HEALTH=$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          READY_HTTP="$(curl --silent --show-error --max-time 10 -o /tmp/ready.json -w '%{http_code}' "$URL/ready")"
          cat /tmp/ready.json
          test "$READY_HTTP" = "200"
          grep -q '"status":"ready"' /tmp/ready.json
