# ╔══════════════════════════════════════════════════════════════╗
# ║  OMNI_AI_BRAIN v1.0 — MAXIMUM INTELLIGENCE PROTOCOL 2026    ║
# ║  Cruce: Claude Code + Gemini CLI + Codex CLI + autofix.ci   ║
# ╚══════════════════════════════════════════════════════════════╝
name: OMNI_AI_BRAIN
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ["ELITE_2026_PROTOCOL"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:

  # ── CAPA 1: AUTOFIX.CI (Linters/Formatters auto-commit) ─────
  autofix:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npx eslint . --fix && npx prettier . -w
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a

  # ── CAPA 2: GEMINI CLI (Code review + análisis arquitectura) ─
  gemini-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          prompt: |
            Eres un senior engineer. Analiza este PR:
            1. Vulnerabilidades de seguridad (OWASP Top 10)
            2. Errores lógicos y edge cases
            3. Performance: N+1 queries, memory leaks, sync blocking
            4. Propón refactors concretos con código
            Sé directo y conciso. No alabes, solo mejora.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ── CAPA 3: CLAUDE CODE (Deep code understanding + fix) ──────
  claude-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this PR for:
            - Smart contract reentrancy and DeFi-specific attack vectors
            - TypeScript type safety violations
            - API key / secret exposure in diffs
            - Missing error boundaries in async flows
            Output as GitHub review comments with line references.

  # ── CAPA 4: CODEX CLI (Auto-repair si CI falla) ──────────────
  codex-autofix:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/autofix.txt
          sandbox: workspace-write
          codex-args: ["--full-auto"]
      - name: Open fix PR
        run: |
          git config user.name "codex-bot"
          git config user.email "codex@noreply"
          git checkout -b codex/autofix-${{ github.run_id }}
          git add -A
          git commit -m "fix(codex): auto-repair CI failure run#${{ github.run_id }}" || exit 0
          git push origin codex/autofix-${{ github.run_id }}
          gh pr create \
            --title "🤖 Codex Auto-Fix: CI failure #${{ github.run_id }}" \
            --body "Auto-generated by Codex CLI. Review and merge if tests pass." \
            --base main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
