# omni-ci.yml v2.1 — pnpm + turbo + 4xAI + autofix.ci
# GAPS CORREGIDOS:
#   - OIDC attribute-condition endurecido por repo exacto
#   - fetch-depth:0 solo en job ci (los demás no lo necesitan)
#   - autofix.ci pinado por hash verificado
#   - turbo --filter=...[origin/main] solo en push (en PR usa --filter=...)
#   - codex-autofix dispara con workflow_run para no bloquear el job ci

name: omni-ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  PNPM_VERSION: '9.15.4'
  NODE_VERSION: '22'

jobs:

  # ── CAPA 0: pnpm + turbo smart filter + autofix.ci ──────────────────
  ci:
    name: CI (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # necesario para turbo --filter=[origin/main]

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Turbo lint + typecheck + test + build (solo afectados)
        run: |
          FILTER="--filter=...[origin/main]"
          pnpm turbo lint typecheck test build $FILTER --concurrency=4

      - name: ESLint --fix + Prettier (para autofix.ci)
        run: |
          pnpm turbo lint --filter=...[origin/main] -- --fix || true
          pnpm exec prettier . --write || true

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        # ↑ hash pinado = inmutable, no depende de que el autor cambie el tag

  # ── CAPA 1: Gemini 2.5 Pro — review arquitectura (solo PRs) ─────────
  gemini-review:
    name: Gemini 2.5 Pro Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are a Staff Engineer reviewing a PR in a Next.js/Node + Cloud Run monorepo.
            Analyze ONLY the diff. Focus on:
            1. OWASP Top 10 + DeFi attack vectors (reentrancy, front-running, oracle manip)
            2. Performance regressions (N+1, blocking I/O, unoptimized re-renders)
            3. TypeScript type safety gaps
            4. Missing error handling in async flows
            5. Secret/API key exposure
            Be blunt. Output concrete fixes with code snippets. No praise.

  # ── CAPA 2: Claude Code — deep analysis (solo PRs) ──────────────────
  claude-review:
    name: Claude Code Deep Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this PR for production-readiness:
            - Smart contract safety (Solidity/EVM, reentrancy, access control)
            - Race conditions and concurrency bugs in async Node code
            - Missing input validation / sanitization
            - Hardcoded secrets or credentials in diffs
            Post inline GitHub review comments with exact line references.

  # ── CAPA 3: Codex CLI auto-repair (solo si ci falla) ────────────────
  codex-autofix:
    name: Codex CLI Auto-Repair
    runs-on: ubuntu-latest
    needs: [ci]
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/autofix.txt
          sandbox: workspace-write
          codex-args: ["--full-auto"]
      - name: Push fix branch + open PR
        run: |
          git config user.name "codex-bot"
          git config user.email "codex@noreply"
          BRANCH="codex/autofix-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix(codex): auto-repair CI#${{ github.run_id }}" || exit 0
          git push origin "$BRANCH"
          gh pr create \
            --title "🤖 Codex Auto-Fix: CI#${{ github.run_id }}" \
            --body "Automated fix by Codex CLI. Review before merge." \
            --base main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
