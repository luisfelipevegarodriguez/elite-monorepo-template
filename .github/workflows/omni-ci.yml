# ╔════════════════════════════════════════════════════════════╗
# ║  OMNI CI v2.0 — pnpm + Turbo + 4 IA Engines + autofix    ║
# ║  Claude Code | Gemini CLI | Codex CLI | autofix.ci         ║
# ╚════════════════════════════════════════════════════════════╝
name: OMNI_CI_v2
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  PNPM_VERSION: 9.15.4
  NODE_VERSION: '22'

jobs:

  # ── CAPA 0: Setup compartido (pnpm + turbo cache) ─────────
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Turbo necesita historial para --filter=[origin/main]

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (solo afectados por cambios)
        run: pnpm turbo lint --filter=...[origin/main] --concurrency=4

      - name: Typecheck
        run: pnpm turbo typecheck --filter=...[origin/main]

      - name: Test
        run: pnpm turbo test --filter=...[origin/main]

      - name: Build
        run: pnpm turbo build --filter=...[origin/main]

      # ─ autofix.ci: auto-commit linter fixes al final ───
      - name: ESLint + Prettier autofix
        run: pnpm turbo lint --filter=...[origin/main] -- --fix; npx prettier . -w || true

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a

  # ── CAPA 1: GEMINI CLI (Review arquitectura en PRs) ──────
  gemini-review:
    name: Gemini 2.5 Pro Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are a Staff Engineer reviewing a PR in a Next.js + Cloud Run monorepo.
            Analyze ONLY the diff. Focus on:
            1. OWASP Top 10 security issues
            2. DeFi/Web3 attack vectors (reentrancy, front-running, oracle manipulation)
            3. Performance regressions (N+1, blocking I/O, unoptimized re-renders)
            4. TypeScript type safety gaps
            5. Missing error handling in async flows
            Be blunt. Output concrete fixes with code snippets.

  # ── CAPA 2: CLAUDE CODE (Deep DeFi/smart contract analysis) ─
  claude-review:
    name: Claude Code Deep Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this PR for production-readiness:
            - Smart contract safety (Solidity/EVM patterns)
            - Secret/API key exposure in diffs
            - Race conditions and concurrency bugs
            - Missing input validation and sanitization
            Post inline review comments with line references on GitHub.

  # ── CAPA 3: CODEX CLI (Auto-repair si CI falla) ─────────────
  codex-autofix:
    name: Codex CLI Auto-Repair
    runs-on: ubuntu-latest
    needs: [ci]
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/autofix.txt
          sandbox: workspace-write
          codex-args: ["--full-auto"]
      - name: Push fix branch + open PR
        run: |
          git config user.name "codex-bot"
          git config user.email "codex@noreply"
          BRANCH="codex/autofix-${{ github.run_id }}"
          git checkout -b $BRANCH
          git add -A
          git commit -m "fix(codex): auto-repair CI failure run#${{ github.run_id }}" || exit 0
          git push origin $BRANCH
          gh pr create \
            --title "🤖 Codex Auto-Fix: CI failure #${{ github.run_id }}" \
            --body "Automated fix by Codex CLI. Review and merge if green." \
            --base main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
